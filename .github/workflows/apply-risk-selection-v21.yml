name: Apply evidence-scoped risk selection v21
on:
  push:
    branches: ['strategy/2026-11-03-01-risk']
    paths:
      - 'catalog/revisions/v21-2026-11-06.json'
      - 'scripts/apply_selection_v21.py'
      - 'tests/test_selection_v21.py'
      - '.github/workflows/apply-risk-selection-v21.yml'
permissions:
  contents: read
concurrency:
  group: risk-selection-v21
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Unjuno/local-model-portfolio' && github.ref == 'refs/heads/strategy/2026-11-03-01-risk'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Validate baseline then apply metadata-only transition
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python scripts/check_parameter_cutoff.py
          python scripts/audit_selection_decisions.py
          python -m scripts.apply_selection_v21 --apply
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/v21-tests.log
          python scripts/check_parameter_cutoff.py
          python scripts/audit_selection_decisions.py
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('catalog/preparation/2026-11-06-v21-integration-check.json')
          data=json.loads(p.read_text())
          log=Path('/tmp/v21-tests.log').read_text()
          matches=re.findall(r'Ran (\d+) tests',log)
          if not matches or '\nOK\n' not in log: raise SystemExit('missing successful test evidence')
          data['full_repository_unittest_count']=int(matches[-1])
          data['full_repository_unittest_passed']=True
          data['parameter_audit_passed']=True
          data['selection_audit_passed']=True
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit only reviewed generated metadata to risk branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/strategy/2026-11-03-01-risk
          remote_sha=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA"
          git add -- catalog/CURRENT.json catalog/effective-portfolio-2026-11-06-v21.json queues/proposed-v21-2026-11-06.json catalog/preparation/2026-11-06-v21-integration-check.json README.md AGENTS.md scripts/audit_selection_decisions.py tests/test_quantized_memory_research.py tests/test_catalog_v19.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'catalog: materialize risk-scoped v21 with four conditional assets [skip ci]'
          git push origin HEAD:refs/heads/strategy/2026-11-03-01-risk
          git rev-parse HEAD
