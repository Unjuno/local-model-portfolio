name: Complete v23 capacity and verify current upstream metadata
on:
  push:
    branches: ['strategy/2026-11-03-01-risk']
    paths:
      - '.github/workflows/capacity-freshness-v23.yml'
      - 'scripts/latest_access_v23.py'
      - 'scripts/capacity_selection_v23.py'
      - 'tests/test_latest_access_v23.py'
      - 'tests/test_capacity_selection_v23.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-capacity-freshness-v23-risk-only
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Unjuno/local-model-portfolio' && github.ref == 'refs/heads/strategy/2026-11-03-01-risk'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Protect selected catalog, queues, limits and historical evidence
        run: |
          set -euo pipefail
          git ls-remote origin refs/heads/main > /tmp/portfolio-main-before
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          c=json.loads(Path('catalog/CURRENT.json').read_text())
          assert c['revision_id']=='v23-20261106'
          paths=[c['materialized_catalog_path'],c['priority_worklist_path'],'queues/approved.json','policies/limits.json',
            'catalog/capacity/2026-11-06/selected-file-capacity.json','catalog/capacity/2026-11-06/capacity-summary.json']
          Path('/tmp/portfolio-protected.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}))
          PY
      - name: Reproduce unfinished draft faults then repair only their causes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,sys
          p=Path('scripts/capacity_selection_v23.py'); s=p.read_text()
          marker="cap.sum_bytes([r['package_bytes'] for r in rows])"
          if marker in s:
              red=subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-p','test_capacity_selection_v23.py','-v'],capture_output=True,text=True)
              log=red.stdout+red.stderr;print(log)
              assert red.returncode!=0 and 'UnboundLocalError' in log, 'expected unfinished draft initialization failure not reproduced'
              def one(old,new):
                  global s
                  assert s.count(old)==1,old
                  s=s.replace(old,new)
              one("                row['index_weight_map_content_checked']=False\n                row['open_dependencies'].append('Holotron fixed index file exists, but pinned weight_map content not parsed; verify shard membership before final acquisition lock')",
                  "                profile['index_weight_map_content_checked']=False")
              one("'shared_dependencies':shared,'open_dependencies':rule['open_dependencies'],",
                  "'shared_dependencies':shared,'open_dependencies':copy.deepcopy(rule['open_dependencies']),")
              one("        rows.append(row);byid[key]=row",
                  "        if profile.get('index_weight_map_content_checked') is False:\n            row['index_weight_map_content_checked']=False\n            row['open_dependencies'].append('Pinned index file bytes known; weight_map content membership still requires review')\n        rows.append(row);byid[key]=row")
              one(marker,"cap.sum_bytes({'bytes':r['package_bytes']} for r in rows)")
              one("cap.sum_bytes([d['bytes'] for d in dependencies])","cap.sum_bytes({'bytes':d['bytes']} for d in dependencies)")
              one("assert (load('queues/approved.json').get('entries') or [])==[]","assert load('queues/approved.json')['entries']==[]")
              compile(s,str(p),'exec');p.write_text(s)
              out=Path('catalog/capacity/2026-11-06/v23');out.mkdir(parents=True,exist_ok=True)
              (out/'draft-repair-evidence.json').write_text(json.dumps({'reproduced_initialization_fault':True,'integer_file_aggregation_interface_corrected':True,'red_log_sha256':hashlib.sha256(log.encode()).hexdigest(),'payloads_downloaded':0},indent=2)+'\n')
          PY
          python -m unittest discover -s tests -p 'test_capacity_selection_v23.py' -v
          python -m unittest discover -s tests -p 'test_latest_access_v23.py' -v
      - name: Compute all 118 primary file scopes without payload transfer
        run: python -m scripts.capacity_selection_v23
      - name: Check current anonymous access metadata and bounded new releases
        run: python -m scripts.latest_access_v23
      - name: Update additive pointers and verify all invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,subprocess,sys
          from pathlib import Path
          def load(p):return json.loads(Path(p).read_text())
          c=load('catalog/CURRENT.json');v=load(c['materialized_catalog_path']);q=load(c['priority_worklist_path'])
          out=Path('catalog/capacity/2026-11-06/v23');fresh=Path('catalog/research/2026-11-06-latest-v23')
          s=load(out/'capacity-summary.json');r=load(out/'selected-file-capacity.json');f=load(fresh/'freshness-summary.json')
          assert len(v['items'])==165 and c['expected']['active']==118
          active={(x['asset_kind'],x['repo_id']) for x in v['items'] if x['portfolio_decision'] in ('select','conditional')}
          assert active=={(x['asset_kind'],x['repo_id']) for x in r['items']}
          assert s['exact_primary_file_scope_count']==118 and s['unresolved_primary_scope_count']==0
          assert s['complete_offline_archive_bytes'] is None and s['physical_disk_free_bytes'] is None
          assert not q['download_enabled'] and not q['approved'] and not load('queues/approved.json')['entries']
          assert f['checked']==118 and f['metadata_observed']+f['unresolved']==118
          assert f['formal_selection_changes']==0 and not f['download_authorized']
          c['capacity_audit'].update(source_revision='v23-20261106',checked_on='2026-11-06',
            summary_path=str(out/'capacity-summary.json'),file_inventory_path=str(out/'selected-file-capacity.json'),
            report_path=str(out/'capacity-report.md'),status='ALL_118_PRIMARY_SCOPES_EXACT_OFFLINE_DEPENDENCIES_AND_OWNER_DISK_UNKNOWN',
            latest_revision_scope_coverage=118,v23_new_assets_unmeasured_count=0,owner_disk_measured=False)
          c['latest_upstream_review']={'date':'2026-11-06','summary_path':str(fresh/'freshness-summary.json'),
            'candidate_decisions_path':str(fresh/'candidate-decisions.json'),'automatically_replaces_selected_revision':False}
          Path('catalog/CURRENT.json').write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          check=subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-v'],capture_output=True,text=True)
          log=check.stdout+check.stderr;print(log)
          assert check.returncode==0, 'regression suite failed'
          n=int(re.search(r'Ran (\d+) tests',log).group(1))
          for script in ('scripts/check_parameter_cutoff.py','scripts/audit_selection_decisions.py'):
              subprocess.run([sys.executable,script],check=True)
          for p,h in load('/tmp/portfolio-protected.json').items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          proof={'source_revision':'v23-20261106','full_suite_verified':True,'test_count':n,
            'parameter_and_selection_audits_passed':True,'active_asset_coverage':118,
            'current_selected_catalog_queues_limits_and_historical_capacity_unchanged':True,
            'owner_disk_measured':False,'weights_downloaded':False,'runtime_tested':False,
            'live_metadata_observed':f['metadata_observed'],'live_metadata_unresolved':f['unresolved'],
            'test_log_sha256':hashlib.sha256(log.encode()).hexdigest(),
            'tested_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
          (out/'verification.json').write_text(json.dumps(proof,indent=2)+'\n')
          doc=['# 30 — v23容量台帳の完了と最新公開・利用条件の照合（2026-11-06）','',
            '正本165資産・有効118件は維持。新規採用・除外・取得承認は変更しない。',
            '一次ファイル総和（配布元メタデータ計算）: '+str(s['known_primary_file_bytes_sum'])+' byte。',
            '既知範囲の内容識別子による論理重複排除後: '+str(s['known_scope_content_union_bytes'])+' byte。',
            '一次ファイル範囲118/118件は確定。完全な外部依存・runtime・物理空き・現物ハッシュは未確定。',
            '外部依存が未解決の資産: '+str(len(s['assets_with_open_dependency_issues']))+'件。',
            '匿名ライブmetadata: '+str(f['metadata_observed'])+'件確認、'+str(f['unresolved'])+'件未解決。',
            '更新版・Gated・LICENSEタグの差は、政府命令や削除予定、ユーザー本人への取得許諾を示さない。',
            '既存固定版を上流の最新mainで自動置換しない。取得失敗を公開停止とみなさない。','',
            '## 最新候補と反証条件',
            'PFNのPLaMo 3 Translateは公式発表2026-11-05。公開日前のrepo作成日と混同しない。0.8Bと8Bの公開原本を調査し、全サイズ・全量子形式を一括追加しない。既存翻訳資産と学習成果が重複する場合は追加しない。',
            'Saluki-27BはLICENSE本文の固定版履歴を調査。現在タグだけでは旧許諾の効力を断定しない。独立の後学習成果を確認するまでは、低ビット形式やライセンス変更だけを採用理由としない。',
            '一次資料: https://www.preferred.jp/en/news/pr20261105 ; https://www.preferred.jp/en/blog/tech/plamo-3-translate-weight-release ; 各固定LICENSE URLはcandidate-decisions.jsonに記録。','',
            '## 検証と限界',
            str(n)+'テストと2監査を通過。モデル実行・本体取得・クラウド課金なし。保存先PC未接続で実空きはUNKNOWN。',
            '機械学習の独自性、供給網の版整合、契約上の許諾、アーカイブの物理復元を別に審査する。']
          Path('docs/strategy/30-v23-capacity-latest-check.md').write_text('\n'.join(doc)+'\n')
          p=Path('README.md');text=p.read_text();heading='## v23容量・公開状態の再照合（2026-11-06）'
          if heading not in text:
              intro='\n'+heading+'\n\n[118件の容量台帳](catalog/capacity/2026-11-06/v23/capacity-summary.json)・[最新公開状態](catalog/research/2026-11-06-latest-v23/freshness-summary.json)・[判断と限界](docs/strategy/30-v23-capacity-latest-check.md)。原本の固定選定と上流の現在版を区別。完全復元依存・保存先実空き・取得承認は別工程。\n'
              p.write_text(text.replace('# Local Model Portfolio\n','# Local Model Portfolio\n'+intro,1))
          print(json.dumps(proof,indent=2))
          PY
      - name: Commit only to dedicated branch with unchanged head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/strategy/2026-11-03-01-risk
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main)" = "$(cat /tmp/portfolio-main-before)"
          git add -- scripts/capacity_selection_v23.py catalog/capacity/2026-11-06/v23 catalog/research/2026-11-06-latest-v23 catalog/CURRENT.json README.md docs/strategy/30-v23-capacity-latest-check.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit: complete 118 primary scopes and record latest access and licensing evidence [skip ci]'
          git push origin HEAD:refs/heads/strategy/2026-11-03-01-risk
          git rev-parse HEAD
