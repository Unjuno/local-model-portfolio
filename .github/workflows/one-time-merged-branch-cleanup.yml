name: One-time pruning of merged historical model-portfolio branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-merged-branch-cleanup.yml'
permissions:
  contents: write
jobs:
  prune:
    if: "github.event.head_commit.message == 'chore: one-time cleanup of merged branches'"
    runs-on: ubuntu-latest
    steps:
      - name: Delete only three exact already-merged branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "strategy/2026-11-03-01-risk|4ee1eaf6052f3ac97f83c001e3e0a04331b8554f"
            "review/ai-model-selection-v3-2026-10-30|3b12ec6bfe6979a3c9d371d5854f22e11d46276b"
            "audit/specialized-tss-rights-2026-11-02|6e9389c97d24528df97e4b14a6bc772780141fd3"
          )
          # Preflight ALL branches before making any deletion.
          for row in "${branches[@]}"; do
            IFS='|' read -r branch expected <<< "$row"
            observed=$(gh api "repos/${GH_REPO}/git/ref/heads/${branch}" --jq '.object.sha')
            test "$observed" = "$expected" || { echo "Ref moved: $branch" >&2; exit 1; }
            behind=$(gh api "repos/${GH_REPO}/compare/${expected}...${MAIN_SHA}" --jq '.behind_by')
            test "$behind" = 0 || { echo "Not merged: $branch" >&2; exit 1; }
          done
          for row in "${branches[@]}"; do
            IFS='|' read -r branch expected <<< "$row"
            observed=$(gh api "repos/${GH_REPO}/git/ref/heads/${branch}" --jq '.object.sha')
            test "$observed" = "$expected" || { echo "Ref moved before deletion: $branch" >&2; exit 1; }
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
            echo "Deleted fully merged branch $branch"
          done
